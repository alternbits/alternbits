<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ appName }} · New list</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="min-h-screen bg-zinc-50 text-zinc-900">
  {{ template "_navbar.html" . }}

  <div class="mx-auto max-w-2xl px-4 py-10 sm:px-6 sm:py-12">
    <header class="mb-8">
      <h1 class="text-2xl font-semibold tracking-tight">New list</h1>
      <p class="mt-1 text-sm text-zinc-500">Group tools into a curated collection.</p>
    </header>

    {{ if .Error }}
    <div class="mb-6 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ .Error }}</div>
    {{ end }}

    <form method="POST" action="/root/lists"
          class="space-y-5 rounded-xl border border-zinc-200 bg-white p-5 shadow-sm">
      {{ with .Form }}
      <div>
        <label for="name" class="block text-sm font-medium text-zinc-700">Name <span class="text-red-500">*</span></label>
        <input type="text" id="name" name="name" required value="{{ .Name }}"
               class="mt-1 block w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-zinc-900 focus:outline-none focus:ring-1 focus:ring-zinc-900">
      </div>

      <div>
        <label for="subtitle" class="block text-sm font-medium text-zinc-700">Subtitle</label>
        <input type="text" id="subtitle" name="subtitle" value="{{ .Subtitle }}"
               class="mt-1 block w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-zinc-900 focus:outline-none focus:ring-1 focus:ring-zinc-900">
        <p class="mt-1 text-xs text-zinc-500">Optional one-liner shown alongside the list.</p>
      </div>

      <div>
        <label for="owner_id" class="block text-sm font-medium text-zinc-700">Owner</label>
        <select id="owner_id" name="owner_id"
                class="mt-1 block w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-zinc-900 focus:outline-none focus:ring-1 focus:ring-zinc-900">
          <option value="">— None —</option>
          {{ $selected := .OwnerID }}
          {{ range $.Owners }}
          <option value="{{ .ID }}" {{ if eq (printf "%d" .ID) $selected }}selected{{ end }}>
            {{ if .Username }}@{{ .Username }}{{ else if .Name }}{{ .Name }}{{ else }}{{ .Email }}{{ end }}
          </option>
          {{ end }}
        </select>
        <p class="mt-1 text-xs text-zinc-500">Optional — attribute this list to a user.</p>
      </div>

      <div>
        <label class="flex items-start gap-2">
          <input type="checkbox" id="is_auto_generated" name="is_auto_generated"
                 {{ if .IsAutoGenerated }}checked{{ end }}
                 class="mt-0.5 h-4 w-4 rounded border-zinc-300 text-zinc-900 focus:ring-zinc-900">
          <span class="text-sm">
            <span class="font-medium text-zinc-700">Auto-generated</span>
            <span class="block text-xs text-zinc-500">Mark as system-managed (e.g. populated by a job rather than hand-curated).</span>
          </span>
        </label>
      </div>
      {{ end }}

      <div class="flex items-center justify-between pt-2">
        <a href="/root/lists" class="text-sm font-medium text-zinc-600 hover:text-zinc-900">Cancel</a>
        <button type="submit"
                class="rounded-lg bg-zinc-900 px-4 py-2 text-sm font-medium text-white hover:bg-zinc-800">
          Create list
        </button>
      </div>
    </form>
  </div>

  {{ template "_footer.html" . }}
</body>
</html>
