<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Altern · Verify 2FA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-50 text-zinc-900">
  <div class="mx-auto flex min-h-screen max-w-md flex-col items-center justify-center px-6">
    <div class="w-full rounded-2xl border border-zinc-200 bg-white p-8 shadow-sm">
      <h1 class="text-xl font-semibold tracking-tight">Two-factor verification</h1>
      <p class="mt-1 text-sm text-zinc-500">Enter the 6-digit code from your authenticator, or a recovery code.</p>

      {{ if .Error }}
      <div class="mt-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ .Error }}</div>
      {{ end }}

      <form method="POST" action="{{ .Post }}" class="mt-6 space-y-3">
        <input type="text" name="code" autocomplete="one-time-code" required
               placeholder="123456"
               class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-center font-mono text-lg tracking-[0.4em] focus:border-zinc-900 focus:outline-none">
        <button type="submit"
                class="w-full rounded-lg bg-zinc-900 px-4 py-2.5 text-sm font-medium text-white hover:bg-zinc-800">
          Verify
        </button>
      </form>
    </div>
  </div>
</body>
</html>
