<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Altern · Set up 2FA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-50 text-zinc-900">
  <div class="mx-auto flex min-h-screen max-w-md flex-col items-center justify-center px-6">
    <div class="w-full rounded-2xl border border-zinc-200 bg-white p-8 shadow-sm">
      <h1 class="text-xl font-semibold tracking-tight">Set up two-factor auth</h1>
      <p class="mt-1 text-sm text-zinc-500">Scan this QR with an authenticator app (1Password, Authy, Google Authenticator), then enter the 6-digit code to confirm.</p>

      {{ if .Error }}
      <div class="mt-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ .Error }}</div>
      {{ end }}

      {{ if .QR }}
      <div class="mt-6 flex justify-center">
        <img src="data:image/png;base64,{{ .QR }}" alt="2FA QR code"
             class="rounded-lg border border-zinc-200 bg-white p-2" width="220" height="220">
      </div>
      <div class="mt-3 text-center text-xs text-zinc-500">
        Or enter manually:
        <code class="ml-1 rounded bg-zinc-100 px-1.5 py-0.5 font-mono text-[11px] tracking-wider text-zinc-700">{{ .Secret }}</code>
      </div>

      <form method="POST" action="{{ .Post }}" class="mt-6 space-y-3">
        <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required
               placeholder="123456"
               class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-center font-mono text-lg tracking-[0.5em] focus:border-zinc-900 focus:outline-none">
        <button type="submit"
                class="w-full rounded-lg bg-zinc-900 px-4 py-2.5 text-sm font-medium text-white hover:bg-zinc-800">
          Confirm and enable
        </button>
      </form>
      {{ end }}
    </div>
  </div>
</body>
</html>
