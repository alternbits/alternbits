root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/altern ./app/main/altern"
  bin = "tmp/altern"
  include_ext = ["go", "html", "tmpl"]
  include_dir = ["app", "views"]
  exclude_dir = ["scaffold", "bin", "log", "tmp", ".git"]
  delay = 200
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = false

[misc]
  clean_on_exit = true
